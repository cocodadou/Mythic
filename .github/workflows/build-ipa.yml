name: Build Mythic IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    env:
      IOS_DEPLOYMENT_TARGET: "17.0"

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Show Xcode version
        run: |
          set -e

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      # ------------------------------------------------------------
      # Homebrew dependencies
      # ------------------------------------------------------------

      - name: Install build dependencies
        run: |
          set -e

          brew install \
            cmake \
            ninja \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            llvm \
            ccache || true

          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Mythic top-level submodules
      # ------------------------------------------------------------

      - name: Initialize Mythic submodules
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync

          git submodule update --init FEX
          git submodule update --init wine
          git submodule update --init research/dxmt

          echo
          echo "Top-level submodules:"
          git submodule status

      # ------------------------------------------------------------
      # FEX nested submodules
      #
      # Compatible with macOS Bash 3.2.
      # rpmalloc is intentionally skipped here.
      # ------------------------------------------------------------

      - name: Initialize FEX submodules except rpmalloc
        shell: bash
        run: |
          set -euo pipefail

          cd FEX

          git submodule sync

          echo "FEX commit:"
          git rev-parse HEAD

          echo
          echo "FEX nested submodules:"

          git config \
            --file .gitmodules \
            --get-regexp path |
          awk '{print $2}' |
          while IFS= read -r submodule; do
            if [ "$submodule" = "External/rpmalloc" ]; then
              echo "[SKIP] $submodule"
              continue
            fi

            echo
            echo "========================================"
            echo "Initializing $submodule"
            echo "========================================"

            git submodule update \
              --init \
              --recursive \
              "$submodule"
          done

      # ------------------------------------------------------------
      # rpmalloc workaround
      # ------------------------------------------------------------

      - name: Install rpmalloc workaround
        shell: bash
        run: |
          set -euo pipefail

          cd FEX

          echo "Removing broken rpmalloc submodule working tree..."

          git submodule deinit \
            -f \
            External/rpmalloc \
            2>/dev/null || true

          rm -rf External/rpmalloc
          rm -rf .git/modules/External/rpmalloc

          echo "Cloning FEX-Emu/rpmalloc..."

          git clone \
            --depth 1 \
            https://github.com/FEX-Emu/rpmalloc.git \
            External/rpmalloc

          echo
          echo "rpmalloc commit:"
          git -C External/rpmalloc rev-parse HEAD

          echo
          echo "rpmalloc contents:"
          ls -la External/rpmalloc

      # ------------------------------------------------------------
      # Verify nested repositories
      # ------------------------------------------------------------

      - name: Verify FEX dependencies
        shell: bash
        run: |
          set -euo pipefail

          FAILED=0

          for directory in \
            "FEX/External/fmt" \
            "FEX/External/xxhash" \
            "FEX/External/rpmalloc" \
            "FEX/External/jemalloc_glibc" \
            "FEX/External/range-v3"
          do
            if [ -d "$directory" ]; then
              echo "[OK] $directory"
            else
              echo "[MISSING] $directory"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      # ------------------------------------------------------------
      # FEX
      # ------------------------------------------------------------

      - name: Configure FEX for iOS
        shell: bash
        run: |
          set -euo pipefail

          rm -rf FEX/build-ios

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DBUILD_THUNKS=OFF \
            -DENABLE_CCACHE=OFF \
            -DENABLE_LTO=OFF

      - name: Build FEX
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build FEX/build-ios \
            --parallel "$(sysctl -n hw.logicalcpu)"

      # ------------------------------------------------------------
      # Show generated FEX libraries
      # ------------------------------------------------------------

      - name: Find FEX static libraries
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated FEX libraries:"

          find FEX/build-ios \
            -type f \
            -name '*.a' \
            -print |
          sort

      # ------------------------------------------------------------
      # Mythic dependency build scripts
      # ------------------------------------------------------------

      - name: Run available Mythic dependency scripts
        shell: bash
        run: |
          set -uo pipefail

          run_script() {
            script="$1"

            if [ ! -f "$script" ]; then
              echo "[SKIP] $script does not exist"
              return 0
            fi

            echo
            echo "========================================"
            echo "Running $script"
            echo "========================================"

            chmod +x "$script"

            if "$script"; then
              echo "[OK] $script"
            else
              echo "[WARNING] $script failed"
            fi
          }

          run_script build/freetype-ios/build.sh
          run_script build/gnutls-ios/build.sh
          run_script build/crypto-unix/build.sh
          run_script build/wineserver/build.sh
          run_script build/ntdll-unix/build.sh
          run_script build/win32u-unix/build.sh
          run_script build/dxmt-ios/build.sh

      # ------------------------------------------------------------
      # Dependency diagnostics
      # ------------------------------------------------------------

      - name: Show generated Mythic libraries
        shell: bash
        run: |
          echo "Libraries under app:"

          find app \
            -type f \
            -name '*.a' \
            -print |
          sort || true

          echo
          echo "Libraries under build:"

          find build \
            -type f \
            -name '*.a' \
            -print |
          sort || true

      # ------------------------------------------------------------
      # Check required static libraries
      # ------------------------------------------------------------

      - name: Check required static libraries
        shell: bash
        run: |
          set -euo pipefail

          MISSING=0

          check_library() {
            file="$1"

            if [ -f "$file" ]; then
              echo "[OK] $file"
            else
              echo "[MISSING] $file"
              MISSING=1
            fi
          }

          echo "Checking static libraries..."
          echo

          check_library "FEX/build-ios/FEXCore/Source/libFEXCore.a"
          check_library "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
          check_library "FEX/build-ios/External/fmt/libfmt.a"
          check_library "FEX/build-ios/External/cephes/libcephes_128bit.a"
          check_library "FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a"
          check_library "FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a"
          check_library "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"

          check_library "app/Mythic/libwineserver.a"
          check_library "app/Mythic/libntdll_unix.a"
          check_library "app/Mythic/libwin32u_unix.a"
          check_library "app/Mythic/libdxmt_combined.a"
          check_library "app/Mythic/libgnutls.a"
          check_library "app/Mythic/libhogweed.a"
          check_library "app/Mythic/libnettle.a"
          check_library "app/Mythic/libgmp.a"

          echo

          if [ "$MISSING" -ne 0 ]; then
            echo "Some required Mythic libraries have not been generated."
            exit 1
          fi

      # ------------------------------------------------------------
      # Xcode diagnostics
      # ------------------------------------------------------------

      - name: Show Xcode project information
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project Mythic.xcodeproj \
            -list

      # ------------------------------------------------------------
      # Build Mythic
      # ------------------------------------------------------------

      - name: Build Mythic for iPhone
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build

          xcodebuild \
            -project Mythic.xcodeproj \
            -target Mythic \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            clean build

      # ------------------------------------------------------------
      # Verify app bundle
      # ------------------------------------------------------------

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail

          APP="app/build/Release-iphoneos/Mythic.app"

          if [ ! -d "$APP" ]; then
            echo "Mythic.app was not generated."

            echo
            echo "Build directory:"

            find app/build \
              -maxdepth 5 \
              -print || true

            exit 1
          fi

          echo "Application:"
          du -sh "$APP"

          echo
          echo "Executable architectures:"

          if [ -f "$APP/Mythic" ]; then
            lipo -info "$APP/Mythic" || true
            file "$APP/Mythic" || true
          fi

      # ------------------------------------------------------------
      # Create unsigned IPA
      # ------------------------------------------------------------

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="app/build/Release-iphoneos/Mythic.app"

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R \
            "$APP" \
            ipa/Payload/

          cd ipa

          /usr/bin/zip \
            -qry \
            Mythic-unsigned.ipa \
            Payload

          echo
          echo "IPA:"
          ls -lh Mythic-unsigned.ipa

      # ------------------------------------------------------------
      # Upload IPA
      # ------------------------------------------------------------

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mythic-unsigned-ipa
          path: ipa/Mythic-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # Diagnostics
      # ------------------------------------------------------------

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mythic-build-debug
          path: |
            FEX/build-ios/CMakeCache.txt
            FEX/build-ios/**/*.log
            build/**/*.log
            build/**/*.err
            app/build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
