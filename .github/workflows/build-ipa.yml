name: Build Mythic IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    env:
      IOS_DEPLOYMENT_TARGET: "17.0"

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "Host architecture:"
          uname -m

      # ------------------------------------------------------------
      # Build dependencies
      # ------------------------------------------------------------

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install \
            cmake \
            ninja \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            llvm \
            ccache || true

          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Top-level Mythic submodules
      # ------------------------------------------------------------

      - name: Initialize Mythic submodules
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync

          git submodule update --init FEX
          git submodule update --init wine
          git submodule update --init research/dxmt

          echo
          echo "Top-level submodules:"
          git submodule status

      # ------------------------------------------------------------
      # Nested FEX submodules
      # ------------------------------------------------------------

      - name: Initialize FEX submodules except rpmalloc
        shell: bash
        run: |
          set -euo pipefail

          cd FEX

          git submodule sync

          echo "FEX commit:"
          git rev-parse HEAD

          git config \
            --file .gitmodules \
            --get-regexp path |
          awk '{print $2}' |
          while IFS= read -r submodule; do
            if [ "$submodule" = "External/rpmalloc" ]; then
              echo "[SKIP] $submodule"
              continue
            fi

            echo
            echo "Initializing $submodule"

            git submodule update \
              --init \
              --recursive \
              "$submodule"
          done

      # ------------------------------------------------------------
      # rpmalloc workaround
      # ------------------------------------------------------------

      - name: Install rpmalloc workaround
        shell: bash
        run: |
          set -euo pipefail

          cd FEX

          git submodule deinit \
            -f \
            External/rpmalloc \
            2>/dev/null || true

          rm -rf External/rpmalloc

          GIT_DIR_PATH="$(git rev-parse --git-dir)"

          rm -rf \
            "${GIT_DIR_PATH}/modules/External/rpmalloc" \
            2>/dev/null || true

          git clone \
            --depth 1 \
            https://github.com/FEX-Emu/rpmalloc.git \
            External/rpmalloc

          echo
          echo "rpmalloc commit:"
          git -C External/rpmalloc rev-parse HEAD

      # ------------------------------------------------------------
      # Verify FEX dependencies
      # ------------------------------------------------------------

      - name: Verify FEX dependencies
        shell: bash
        run: |
          set -euo pipefail

          FAILED=0

          for directory in \
            "FEX/External/fmt" \
            "FEX/External/xxhash" \
            "FEX/External/rpmalloc" \
            "FEX/External/jemalloc_glibc" \
            "FEX/External/range-v3" \
            "FEX/External/SoftFloat-3e" \
            "FEX/External/cephes"
          do
            if [ -d "$directory" ]; then
              echo "[OK] $directory"
            else
              echo "[MISSING] $directory"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      # ------------------------------------------------------------
      # Patch the Win32-only CASPAL diagnostic
      #
      # This replaces only the MEMORY_BASIC_INFORMATION /
      # VirtualQuery diagnostic section. The actual CASPAL handling
      # remains untouched.
      # ------------------------------------------------------------

      - name: Patch FEX CASPAL iOS diagnostic
        shell: bash
        run: |
          set -euo pipefail

          FILE="FEX/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp"

          echo "Checking source before patch..."

          grep -n \
            "static void IosLogUnimplementedCASPAL" \
            "$FILE"

          grep -n \
            "MEMORY_BASIC_INFORMATION" \
            "$FILE"

          python3 <<'PY'
          from pathlib import Path

          path = Path("FEX/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp")
          source = path.read_text()

          old = '''  MEMORY_BASIC_INFORMATION mbi {};
            const char* type = "?";
            if (VirtualQuery(reinterpret_cast<LPCVOID>(GPRs[AddressReg]), &mbi, sizeof(mbi))) {
              type = mbi.Type == MEM_IMAGE ? "MEM_IMAGE" : mbi.Type == MEM_MAPPED ? "MEM_MAPPED" : "MEM_PRIVATE";
            }
            LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} "
                              "crosses16B={} | region base={} size={:#x} prot={:#x} type={} state={:#x}",
                              Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15,
                              (GPRs[AddressReg] & 15) ? "yes" : "no", mbi.BaseAddress, mbi.RegionSize,
                              mbi.Protect, type, mbi.State);
          '''

          new = '''  LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} "
                              "crosses16B={}",
                              Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15,
                              (GPRs[AddressReg] & 15) ? "yes" : "no");
          '''

          if old not in source:
              print("Exact block was not found. Trying line-based patch.")

              lines = source.splitlines()
              output = []

              i = 0
              patched = False

              while i < len(lines):
                  if "MEMORY_BASIC_INFORMATION mbi {};" in lines[i]:
                      start = i

                      while start > 0 and "/* ml223:" not in lines[start]:
                          start -= 1

                      end = i

                      while end < len(lines) and "mbi.State);" not in lines[end]:
                          end += 1

                      if end >= len(lines):
                          raise SystemExit(
                              "Found MEMORY_BASIC_INFORMATION but could not "
                              "find the end of its logging block."
                          )

                      # Preserve the comment preceding the Win32 section only
                      # up to the MEMORY_BASIC_INFORMATION declaration.
                      for j in range(start, i):
                          output.append(lines[j])

                      output.extend([
                          '  LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} "',
                          '                    "crosses16B={}",',
                          '                    Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15,',
                          '                    (GPRs[AddressReg] & 15) ? "yes" : "no");',
                      ])

                      i = end + 1
                      patched = True
                      continue

                  output.append(lines[i])
                  i += 1

              if not patched:
                  raise SystemExit(
                      "Failed to locate the Win32 CASPAL diagnostic block."
                  )

              source = "\n".join(output) + "\n"

          else:
              source = source.replace(old, new, 1)

          path.write_text(source)

          print("CASPAL diagnostic patched successfully.")
          PY

          echo
          echo "Checking patched source..."

          if grep -n \
            -E 'MEMORY_BASIC_INFORMATION|VirtualQuery|LPCVOID|MEM_IMAGE|MEM_MAPPED' \
            "$FILE"; then

            echo
            echo "Unsupported Win32 symbols remain in Arm64.cpp."
            exit 1
          fi

          echo "[OK] Win32 CASPAL diagnostic removed."

          echo
          echo "Current CASPAL diagnostic:"
          sed -n '630,675p' "$FILE"

      # ------------------------------------------------------------
      # Configure FEX
      # ------------------------------------------------------------

      - name: Configure FEX for iOS
        shell: bash
        run: |
          set -euo pipefail

          rm -rf FEX/build-ios

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_CXX_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_ASM_FLAGS="-DFEX_IOS_HOST=1" \
            -DTUNE_CPU=none \
            -DTUNE_ARCH=generic \
            -DBUILD_TESTING=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DENABLE_CCACHE=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_ZYDIS=OFF

      # ------------------------------------------------------------
      # Verify compiler flags
      # ------------------------------------------------------------

      - name: Verify FEX iOS compiler flags
        shell: bash
        run: |
          set -euo pipefail

          FILE="FEX/build-ios/compile_commands.json"

          if [ ! -f "$FILE" ]; then
            echo "compile_commands.json was not generated."
            exit 1
          fi

          if grep -q "FEX_IOS_HOST" "$FILE"; then
            echo "[OK] FEX_IOS_HOST is present."
          else
            echo "[ERROR] FEX_IOS_HOST is missing."
            exit 1
          fi

      # ------------------------------------------------------------
      # Build FEX
      # ------------------------------------------------------------

      - name: Build FEX
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build FEX/build-ios \
            --parallel "$(sysctl -n hw.logicalcpu)"

      # ------------------------------------------------------------
      # Find FEX libraries
      # ------------------------------------------------------------

      - name: Find FEX static libraries
        shell: bash
        run: |
          set -euo pipefail

          find FEX/build-ios \
            -type f \
            -name '*.a' \
            -print |
          sort

      # ------------------------------------------------------------
      # Mythic dependency scripts
      # ------------------------------------------------------------

      - name: Run available Mythic dependency scripts
        shell: bash
        run: |
          set -uo pipefail

          run_script() {
            script="$1"

            if [ ! -f "$script" ]; then
              echo "[SKIP] $script does not exist"
              return 0
            fi

            echo
            echo "========================================"
            echo "Running $script"
            echo "========================================"

            chmod +x "$script"

            if "$script"; then
              echo "[OK] $script"
            else
              echo "[WARNING] $script failed"
            fi
          }

          run_script build/freetype-ios/build.sh
          run_script build/gnutls-ios/build.sh
          run_script build/crypto-unix/build.sh
          run_script build/wineserver/build.sh
          run_script build/ntdll-unix/build.sh
          run_script build/win32u-unix/build.sh
          run_script build/dxmt-ios/build.sh

      # ------------------------------------------------------------
      # Show generated Mythic libraries
      # ------------------------------------------------------------

      - name: Show generated Mythic libraries
        shell: bash
        run: |
          echo "Libraries under app:"
          find app \
            -type f \
            -name '*.a' \
            -print |
          sort || true

          echo
          echo "Libraries under build:"
          find build \
            -type f \
            -name '*.a' \
            -print |
          sort || true

      # ------------------------------------------------------------
      # Check required libraries
      # ------------------------------------------------------------

      - name: Check required static libraries
        shell: bash
        run: |
          set -euo pipefail

          MISSING=0

          check_library() {
            file="$1"

            if [ -f "$file" ]; then
              echo "[OK] $file"
            else
              echo "[MISSING] $file"
              MISSING=1
            fi
          }

          check_library "FEX/build-ios/FEXCore/Source/libFEXCore.a"
          check_library "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
          check_library "FEX/build-ios/External/fmt/libfmt.a"
          check_library "FEX/build-ios/External/cephes/libcephes_128bit.a"
          check_library "FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a"
          check_library "FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a"
          check_library "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"

          check_library "app/Mythic/libwineserver.a"
          check_library "app/Mythic/libntdll_unix.a"
          check_library "app/Mythic/libwin32u_unix.a"
          check_library "app/Mythic/libdxmt_combined.a"
          check_library "app/Mythic/libgnutls.a"
          check_library "app/Mythic/libhogweed.a"
          check_library "app/Mythic/libnettle.a"
          check_library "app/Mythic/libgmp.a"

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

      # ------------------------------------------------------------
      # Xcode project
      # ------------------------------------------------------------

      - name: Show Xcode project information
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project Mythic.xcodeproj \
            -list

      # ------------------------------------------------------------
      # Build Mythic
      # ------------------------------------------------------------

      - name: Build Mythic for iPhone
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build

          xcodebuild \
            -project Mythic.xcodeproj \
            -target Mythic \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            clean build

      # ------------------------------------------------------------
      # Verify app
      # ------------------------------------------------------------

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail

          APP="app/build/Release-iphoneos/Mythic.app"

          if [ ! -d "$APP" ]; then
            echo "Mythic.app was not generated."

            find app/build \
              -maxdepth 5 \
              -print || true

            exit 1
          fi

          du -sh "$APP"

          if [ -f "$APP/Mythic" ]; then
            lipo -info "$APP/Mythic" || true
            file "$APP/Mythic" || true
          fi

      # ------------------------------------------------------------
      # Create IPA
      # ------------------------------------------------------------

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="app/build/Release-iphoneos/Mythic.app"

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R \
            "$APP" \
            ipa/Payload/

          cd ipa

          /usr/bin/zip \
            -qry \
            Mythic-unsigned.ipa \
            Payload

          ls -lh Mythic-unsigned.ipa

      # ------------------------------------------------------------
      # Upload IPA
      # ------------------------------------------------------------

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mythic-unsigned-ipa
          path: ipa/Mythic-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # Diagnostics
      # ------------------------------------------------------------

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mythic-build-debug
          path: |
            FEX/build-ios/CMakeCache.txt
            FEX/build-ios/compile_commands.json
            FEX/build-ios/**/*.log
            build/**/*.log
            build/**/*.err
            app/build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
